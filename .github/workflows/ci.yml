name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Import + CLI smoke
        run: |
          python -c "from focuslog.server import create_app; from focuslog.insights import build_insight; print('ok')"
          focuslog version
          focuslog start -m 1 -l "CI" --no-tick
          focuslog distract "CI pull" -c chat
          focuslog done
          focuslog report
