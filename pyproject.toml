[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focuslog"
version = "1.1.0"
description = "Pomodoro timer + distraction log with weekly analytics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Veliation AI" }]
keywords = [
  "pomodoro",
  "focus",
  "productivity",
  "distraction",
  "analytics",
  "cli",
  "timer",
  "open-source",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "ruff>=0.6.0"]

[project.scripts]
focuslog = "focuslog.cli:app"

[project.urls]
Homepage = "https://github.com/VeliationAI/focuslog"
Repository = "https://github.com/VeliationAI/focuslog"
Issues = "https://github.com/VeliationAI/focuslog/issues"
Changelog = "https://github.com/VeliationAI/focuslog/blob/main/CHANGELOG.md"
"Live Demo" = "https://focuslog-xu9t.onrender.com"

[tool.setuptools.packages.find]
include = ["focuslog*"]

[tool.setuptools.package-data]
focuslog = ["static/*", "templates/*"]
